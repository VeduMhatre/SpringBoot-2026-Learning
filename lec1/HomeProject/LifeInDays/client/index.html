<html>
	<head> 
		<title> Days Checker </title>
		<style>
			*{
				font-size: 40px;
				text-align: center;
			}
			body{
				background-color: linen;
			}
		</style>
	</head>
<body>
	<h1>Age to Days Calculator</h1>
	<form onsubmit="checker(event)">
		<input type="number"
		id="age"
		placeholder="Enter Age"/>
		<br><br>
		<input type="submit"
		value="calculate"/>
			
	</form>
		<h2 id="ans"></h2>
		<script>
			function checker(event){
			event.preventDefault()
			let age = document.getElementById("age").value
			let url = "http://localhost:8080/checker?age= "+ age
			
			fetch(url)
			.then(res => res.text())
			.then(data => {
				document.getElementById("ans").textContent = data;
			})
			.catch(err => {
				document.getElementById("ans").textContent = "Issue: " + err;
			});
			}
		</script>
</body>
</html>
